schema_version: 1
skill:
  id: batch-investigation
  version: "0.9.0"
  description: Gene-first batch evidence followed by one concise, evidence-bound handling choice.
tools:
  - name: investigate_batch
    description: Produce gene-first batch evidence, a concise interpretation, and a non-binding recommendation. Records no handling decision.
    entrypoint: scripts/investigate.py:run_evidence
    environment: gpu-singlecell
    activity_label: Investigating batch evidence
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: Any H5AD with expression values, cluster labels, and a meaningful batch column when batch_key is non-null.
        batch_key:
          type: [string, "null"]
          description: Observation column for a meaningful batch unit; null records not_applicable.
        cluster_key: {type: string, default: leiden}
      required: [batch_key]
      additionalProperties: false
    primary_matrix_input: path
  - name: decide_batch_handling
    description: Record the user's concise handling choice against the current batch evidence.
    entrypoint: scripts/investigate.py:run_decision
    environment: gpu-singlecell
    activity_label: Recording batch decision
    input_schema:
      type: object
      properties:
        evidence_id: {type: string, minLength: 1}
        decision:
          type: string
          enum: [keep_uncorrected, integrate, separate]
        rationale:
          type: string
          minLength: 1
          description: One or two grounded sentences explaining the choice; do not restate the report.
      required: [evidence_id, decision, rationale]
      additionalProperties: false
