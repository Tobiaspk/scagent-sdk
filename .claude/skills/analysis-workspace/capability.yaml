schema_version: 1
skill:
  id: analysis-workspace
  version: "0.2.1"
  description: Auditable filesystem inspection, general shell execution, and custom scientific Python.
tools:
  - name: list_workspace
    description: List bounded file metadata for a directory without modifying it.
    entrypoint: scripts/workspace.py:list_workspace
    activity_label: Listing workspace
    input_schema:
      type: object
      properties:
        path: {type: string}
        max_entries: {type: integer, minimum: 1, maximum: 1000, default: 200}
        depth: {type: integer, minimum: 0, maximum: 4, default: 2}
      required: [path]
      additionalProperties: false
  - name: read_text_file
    description: Read one bounded, paginated UTF-8 text range for inspection.
    entrypoint: scripts/workspace.py:read_text_file
    activity_label: Reading text file
    input_schema:
      type: object
      properties:
        path: {type: string}
        offset_chars: {type: integer, minimum: 0, default: 0}
        max_chars: {type: integer, minimum: 1, maximum: 32000, default: 20000}
      required: [path]
      additionalProperties: false
  - name: run_shell_command
    description: Run a general shell command on trusted Iris in-process execution, capturing command, stdout, stderr, exit status, and duration as provenance.
    entrypoint: scripts/workspace.py:run_shell_command
    activity_label: Running shell command
    input_schema:
      type: object
      properties:
        command: {type: string, minLength: 1}
        cwd: {type: [string, "null"], default: null, description: Working directory; null uses the scientific session directory.}
        timeout_seconds: {type: integer, minimum: 1, maximum: 3600, default: 600}
      required: [command]
      additionalProperties: false
  - name: run_analysis_code
    description: "Execute saved custom scientific Python in the trusted Iris scientific environment and register generated artifacts; this is auditable in-process execution, not a security sandbox. Injected names: np, pd, sc, ad, plt, Path, workspace (a Path to this execution's staging directory), session_dir, register_artifact. Write every output you intend to keep under `workspace` and register it from there - register_artifact rejects a path outside it."
    entrypoint: scripts/run_code.py:run
    environment: gpu-singlecell
    activity_label: Running code
    input_schema:
      type: object
      properties:
        code: {type: string, minLength: 1}
        purpose: {type: string, minLength: 1}
      required: [code, purpose]
      additionalProperties: false
