schema_version: 1
skill:
  id: celltypist-annotation
  version: "0.4.0"
  description: Standalone per-cell CellTypist predictions and optional grouping summaries.
readiness:
  entrypoint: scripts/readiness.py:probe
  environment: celltypist
tools:
  - name: run_celltypist_annotation
    description: Run a cached CellTypist model on raw counts and gene symbols, saving per-cell labels and confidence.
    entrypoint: scripts/run_celltypist.py:run
    environment: celltypist
    activity_label: Running CellTypist
    input_schema:
      type: object
      properties:
        branch_from: {type: string, description: "Fork an alternative from a recorded version instead of continuing the current one. The active version does not change. Use this to compare alternatives - not to work around a superseded path."}
        path: {type: string, description: "Any H5AD with raw counts in the selected layer or X."}
        model: {type: string, minLength: 1, description: Explicitly selected cached model filename or absolute model path; no generic default is assumed.}
        counts_layer: {type: [string, "null"], default: counts, description: Raw-count layer name; use X or null for adata.X.}
        output_key: {type: string, default: celltypist_prediction}
      required: [model]
      additionalProperties: false
    primary_matrix_input: path
    primary_matrix_output: celltypist-annotated-anndata
  - name: summarize_celltypist_by_cluster
    description: Aggregate existing per-cell CellTypist predictions and confidence over any supplied grouping as an optional step separate from inference.
    entrypoint: scripts/run_celltypist.py:summarize_by_cluster
    environment: celltypist
    activity_label: Summarizing CellTypist predictions
    input_schema:
      type: object
      properties:
        path: {type: string}
        cluster_key: {type: string}
        prediction_key: {type: string, default: celltypist_prediction}
        confidence_key: {type: string, default: celltypist_prediction_confidence}
      required: [cluster_key]
      additionalProperties: false
    primary_matrix_input: path
