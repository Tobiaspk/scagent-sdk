schema_version: 1
skill:
  id: scvi-integration
  version: "0.3.0"
  description: Standalone count-aware scVI latent-model training.
tools:
  - name: train_scvi_latent
    description: Train scVI from raw counts with an explicit batch covariate and save the model plus X_scVI latent representation; do not build neighbors, UMAP, or clusters.
    entrypoint: scripts/integrate.py:run
    environment: scvi
    activity_label: Training scVI latent model
    floors: [integration_authorized]
    input_schema:
      type: object
      properties:
        branch_from: {type: string, description: "Fork an alternative from a recorded version instead of continuing the current one. The active version does not change. Use this to compare alternatives - not to work around a superseded path."}
        path: {type: string, description: "Prepared H5AD path with layers['counts']."}
        batch_key: {type: string}
        n_latent: {type: integer, minimum: 2, maximum: 100, default: 30}
        n_layers: {type: integer, minimum: 1, maximum: 5, default: 2}
        max_epochs: {type: integer, minimum: 1, default: 200}
        random_seed: {type: integer, default: 0}
      required: [batch_key]
      additionalProperties: false
    primary_matrix_input: path
    primary_matrix_output: scvi-latent-anndata
  - name: score_integration
    description: Score how well an integration mixed batches — per-cell neighborhood batch entropy on the corrected latent (X_scVI) versus the X_pca baseline. Use once after integrating to verify mixing improved; do NOT re-run investigate_batch to check integration. Read-only scoring; writes no matrix.
    entrypoint: scripts/score.py:run
    environment: gpu-singlecell
    activity_label: Scoring integration mixing
    input_schema:
      type: object
      properties:
        path: {type: string, description: "Integrated H5AD/zarr with obsm['X_scVI'] (and obsm['X_pca'] baseline)."}
        batch_key: {type: string, description: "Batch column; defaults to the key scVI conditioned on."}
        use_rep: {type: string, default: X_scVI, description: "Corrected latent to score (never X_umap)."}
        n_neighbors: {type: integer, minimum: 5, maximum: 200, default: 50}
      additionalProperties: false
    primary_matrix_input: path
