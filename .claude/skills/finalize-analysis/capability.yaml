schema_version: 1
skill:
  id: finalize-analysis
  version: "0.5.0"
  description: Publish a complete cluster-to-label mapping and final annotated artifact.
tools:
  - name: finalize_analysis
    description: Validate complete cluster labels, save a final annotated AnnData and report, and mark the scientific session finalized. QC, batch, and reference reviews are useful context rather than prerequisites.
    entrypoint: scripts/finalize.py:run
    environment: gpu-singlecell
    activity_label: Finalizing analysis
    input_schema:
      type: object
      properties:
        branch_from: {type: string, description: "Fork an alternative from a recorded version instead of continuing the current one. The active version does not change. Use this to compare alternatives - not to work around a superseded path."}
        path: {type: string, description: Current prepared or integrated H5AD path.}
        cluster_key: {type: string, default: leiden}
        label_key: {type: string, default: cell_type}
        labels:
          type: object
          additionalProperties: {type: string, minLength: 1}
        rationales:
          type: object
          default: {}
          description: Optional concise per-cluster rationale when it adds useful context.
          additionalProperties: {type: string, minLength: 1}
        deg_labels:
          type: object
          default: {}
          description: Optional independently written DEG-derived hypotheses retained for provenance.
          additionalProperties: {type: string, minLength: 1}
        evidence_summaries:
          type: object
          default: {}
          description: Optional per-cluster evidence summaries.
          additionalProperties: {type: string, minLength: 1}
        confidence:
          type: object
          default: {}
          description: Optional per-cluster confidence. Omitted values are reported as not specified.
          additionalProperties: {type: string, enum: [high, medium, low]}
        overrides:
          type: object
          default: {}
          description: Optional notes for substantive evidence-based changes from an earlier hypothesis.
          additionalProperties: {type: string, minLength: 1}
        analysis_summary:
          type: string
          minLength: 1
          default: Finalized cluster annotation.
        caveats:
          type: array
          items: {type: string}
      required: [labels]
      additionalProperties: false
    primary_matrix_input: path
    primary_matrix_output: final-annotated-anndata
