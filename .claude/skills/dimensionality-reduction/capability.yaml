schema_version: 1
skill:
  id: dimensionality-reduction
  version: "0.3.0"
  description: Independent PCA, neighbor-graph, and UMAP transformations.
tools:
  - name: compute_single_cell_pca
    description: Compute PCA on the GPU with RAPIDS SingleCell, optionally using an existing highly-variable-gene mask.
    entrypoint: scripts/reduce.py:compute_pca
    environment: gpu-singlecell
    activity_label: Computing PCA
    input_schema:
      type: object
      properties:
        branch_from: {type: string, description: "Fork an alternative from a recorded version instead of continuing the current one. The active version does not change. Use this to compare alternatives - not to work around a superseded path."}
        path: {type: string}
        n_components: {type: integer, minimum: 2, maximum: 200, default: 50}
        use_highly_variable: {type: boolean, default: true}
        random_seed: {type: integer, default: 0}
      additionalProperties: false
    primary_matrix_input: path
    primary_matrix_output: pca-anndata
  - name: build_single_cell_neighbors
    description: Build a GPU nearest-neighbor graph with RAPIDS SingleCell from an explicitly named representation such as X_pca, X_scVI, or X_scimilarity.
    entrypoint: scripts/reduce.py:build_neighbors
    environment: gpu-singlecell
    activity_label: Building neighbors
    input_schema:
      type: object
      properties:
        branch_from: {type: string, description: "Fork an alternative from a recorded version instead of continuing the current one. The active version does not change. Use this to compare alternatives - not to work around a superseded path."}
        path: {type: string}
        representation_key: {type: string, default: X_pca}
        neighbors_key: {type: string, default: neighbors}
        n_neighbors: {type: integer, minimum: 2, default: 15}
        n_pcs: {type: [integer, "null"], minimum: 2, default: null}
        random_seed: {type: integer, default: 0}
      additionalProperties: false
    primary_matrix_input: path
    primary_matrix_output: neighbors-anndata
  - name: compute_single_cell_umap
    description: Compute a GPU UMAP visualization with RAPIDS SingleCell from an existing neighbor graph.
    entrypoint: scripts/reduce.py:compute_umap
    environment: gpu-singlecell
    activity_label: Computing UMAP
    input_schema:
      type: object
      properties:
        branch_from: {type: string, description: "Fork an alternative from a recorded version instead of continuing the current one. The active version does not change. Use this to compare alternatives - not to work around a superseded path."}
        path: {type: string}
        neighbors_key: {type: string, default: neighbors}
        umap_key: {type: string, default: X_umap}
        min_dist: {type: number, minimum: 0, maximum: 1, default: 0.5}
        spread: {type: number, exclusiveMinimum: 0, default: 1.0}
        random_seed: {type: integer, default: 0}
      additionalProperties: false
    primary_matrix_input: path
    primary_matrix_output: umap-anndata
