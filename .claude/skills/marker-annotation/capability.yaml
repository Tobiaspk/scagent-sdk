schema_version: 1
skill:
  id: marker-annotation
  version: "0.5.1"
  description: Transparent cluster DEG/marker evidence and evidence-bound annotation review.
tools:
  - name: evaluate_marker_evidence
    description: Rank genes for a supplied grouping, score broad or user-supplied marker programs, and save candidate evidence.
    entrypoint: scripts/markers.py:run
    environment: gpu-singlecell
    activity_label: Evaluating marker evidence
    input_schema:
      type: object
      properties:
        path: {type: string, description: Prepared H5AD path.}
        cluster_key: {type: string, default: leiden}
        organism: {type: string, enum: [human, mouse], default: human, description: "Gates the Cytopus knowledge base, which is human-only; it has no other effect. Marker scoring is case-folded, so it does not depend on this. Set mouse only when the dataset is known to be mouse - do not infer a species from gene-symbol casing or from the file name."}
        top_n: {type: integer, minimum: 5, maximum: 100, default: 30}
        min_logfoldchange: {type: number, default: 0.25}
        max_adjusted_pvalue: {type: number, exclusiveMinimum: 0, maximum: 1, default: 0.05}
        min_marker_overlap: {type: integer, minimum: 1, default: 2}
        use_cytopus:
          type: boolean
          default: true
          description: Augment built-in human marker programs from the curated Cytopus knowledge base when available.
        marker_sets:
          type: object
          additionalProperties:
            type: array
            minItems: 1
            items: {type: string, minLength: 1}
      additionalProperties: false
    primary_matrix_input: path
  - name: review_annotation_evidence
    description: Optionally record a concise review of any current annotation evidence. The tool can infer current method keys and preserves uncertain clusters as valid reviewed outcomes.
    entrypoint: scripts/markers.py:review_annotation_evidence
    environment: current
    activity_label: Reviewing annotation evidence
    input_schema:
      type: object
      properties:
        methods_reviewed:
          type: array
          uniqueItems: true
          default: []
          description: Canonical current evidence keys. Omit to record all current methods.
          items: {type: string, minLength: 1}
        reviewed_artifacts:
          type: array
          uniqueItems: true
          default: []
          items: {type: string, minLength: 1}
        agreement_findings:
          type: array
          default: []
          items: {type: string, minLength: 1}
        unresolved_clusters:
          type: array
          uniqueItems: true
          default: []
          items: {type: string, minLength: 1}
          description: Reviewed clusters whose identity remains uncertain; uncertainty does not make the review incomplete.
        reference_waiver:
          type: [string, "null"]
          default: null
          description: Optional note about unavailable or unsuitable reference methods.
        rationale:
          type: string
          minLength: 1
          default: Reviewed the current annotation evidence.
      additionalProperties: false
