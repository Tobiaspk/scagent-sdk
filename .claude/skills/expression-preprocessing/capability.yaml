schema_version: 1
skill:
  id: expression-preprocessing
  version: "0.2.1"
  description: Independent normalization and highly-variable-gene selection.
tools:
  - name: normalize_single_cell_expression
    description: Normalize validated raw counts from a named layer or X and log1p-transform X on the GPU with RAPIDS SingleCell while preserving raw counts.
    entrypoint: scripts/preprocess.py:normalize_expression
    environment: gpu-singlecell
    activity_label: Normalizing expression
    input_schema:
      type: object
      properties:
        branch_from: {type: string, description: "Fork an alternative from a recorded version instead of continuing the current one. The active version does not change. Use this to compare alternatives - not to work around a superseded path."}
        path: {type: string}
        counts_layer:
          type: [string, "null"]
          default: auto
          description: "'auto' uses layers['counts'] when present and otherwise validates X; null explicitly uses X."
        target_sum: {type: number, exclusiveMinimum: 0, default: 10000}
      additionalProperties: false
    primary_matrix_input: path
    primary_matrix_output: log-normalized-anndata
  - name: select_highly_variable_genes
    description: Compute and record a highly-variable-gene mask with RAPIDS SingleCell without subsetting or running dimensionality reduction.
    entrypoint: scripts/preprocess.py:select_hvg
    environment: gpu-singlecell
    activity_label: Selecting variable genes
    input_schema:
      type: object
      properties:
        branch_from: {type: string, description: "Fork an alternative from a recorded version instead of continuing the current one. The active version does not change. Use this to compare alternatives - not to work around a superseded path."}
        path: {type: string}
        n_top_genes: {type: integer, minimum: 2, default: 3000}
        flavor: {type: string, enum: [seurat, cell_ranger, seurat_v3, seurat_v3_paper], default: seurat}
        layer: {type: [string, "null"], default: null, description: Optional matrix layer; null uses X.}
        batch_key: {type: [string, "null"], default: null}
      additionalProperties: false
    primary_matrix_input: path
    primary_matrix_output: hvg-anndata
