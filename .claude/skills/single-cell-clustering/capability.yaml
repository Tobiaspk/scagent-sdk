schema_version: 1
skill:
  id: single-cell-clustering
  version: "0.4.0"
  description: Independent Leiden clustering and group-wise gene ranking.
tools:
  - name: cluster_single_cells
    description: Run GPU Leiden with RAPIDS SingleCell on an existing named neighbor graph and save labels under an explicit observation key.
    entrypoint: scripts/clustering.py:cluster_cells
    environment: gpu-singlecell
    activity_label: Clustering cells
    input_schema:
      type: object
      properties:
        branch_from: {type: string, description: "Fork an alternative from a recorded version instead of continuing the current one. The active version does not change. Use this to compare alternatives - not to work around a superseded path."}
        path: {type: string}
        neighbors_key: {type: string, default: neighbors}
        cluster_key: {type: string, default: leiden}
        resolution:
          type: number
          exclusiveMinimum: 0
          description: "Leiden granularity. There is no default: state it deliberately for the phase you are in (exploratory QC clustering is coarse-blind and wants a high value; the annotation clustering wants interpretable granularity). Read the skill instructions before choosing."
        random_seed: {type: integer, default: 0}
      required: [resolution]
      additionalProperties: false
    primary_matrix_input: path
    primary_matrix_output: clustered-anndata
  - name: rank_single_cell_groups
    description: Rank genes for an existing grouping and save a complete differential-expression table.
    entrypoint: scripts/clustering.py:rank_groups
    environment: gpu-singlecell
    activity_label: Ranking group genes
    input_schema:
      type: object
      properties:
        branch_from: {type: string, description: "Fork an alternative from a recorded version instead of continuing the current one. The active version does not change. Use this to compare alternatives - not to work around a superseded path."}
        path: {type: string}
        group_key: {type: string}
        method: {type: string, enum: [wilcoxon, t-test, t-test_overestim_var, logreg], default: wilcoxon}
        layer: {type: [string, "null"], default: null}
        use_raw: {type: boolean, default: false}
        reference: {type: string, default: rest}
      required: [group_key]
      additionalProperties: false
    primary_matrix_input: path
    primary_matrix_output: ranked-groups-anndata
