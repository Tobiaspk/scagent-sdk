[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "scagent-sdk"
version = "0.1.0"
description = "Independent, skill-driven single-cell analysis agent runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "scagent contributors" }]
dependencies = ["pyyaml>=6.0", "tomli>=2.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
runtime = ["claude-agent-sdk>=0.2.124,<0.3"]
gateway = ["litellm[proxy]>=1.80,<2"]
terminal = ["prompt-toolkit>=3.0", "rich>=13.9"]
media = ["pillow>=11.0", "pymupdf>=1.25"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
  "mypy>=1.13",
  "types-pyyaml>=6.0",
]

[project.scripts]
scagent-sdk = "scagent_sdk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scagent_sdk"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "scagent_sdk/configs"
".claude/skills" = "scagent_sdk/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["scagent_sdk"]
