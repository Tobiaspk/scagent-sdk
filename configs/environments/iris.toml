schema_version = 2
host = "iris"

# Physical runtimes own interpreter and loader activation. Logical capabilities below may
# share a runtime without duplicating or exposing its host-specific mechanics to skills.
[runtimes.rapids-main]
python = "/home/ibrahih3/projects/scagent-sdk/.pixi/envs/rapids/bin/python"
prefix = "/home/ibrahih3/projects/scagent-sdk/.pixi/envs/rapids"
probe_timeout_seconds = 180
gpu_probe = "cupy"
probe_modules = ["torch", "numpy", "rapids_singlecell", "cupy", "scvi"]
provenance_files = [
  "/home/ibrahih3/projects/scagent-sdk/pixi.toml",
  "/home/ibrahih3/projects/scagent-sdk/pixi.lock",
]

[runtimes.rapids-main.environment]
SCAGENT_GPU = "1"
MPLBACKEND = "Agg"
CUDA_HOME = "{prefix}"
LD_PRELOAD = "{prefix}/lib/libstdc++.so.6:{prefix}/lib/libnvJitLink.so.13"

[runtimes.cellbender]
python = "/home/ibrahih3/projects/scagent-sdk/.pixi/envs/cellbender/bin/python"
prefix = "/home/ibrahih3/projects/scagent-sdk/.pixi/envs/cellbender"
probe_timeout_seconds = 300
gpu_probe = "torch"
probe_modules = ["torch", "cellbender"]
provenance_files = [
  "/home/ibrahih3/projects/scagent-sdk/pixi.toml",
  "/home/ibrahih3/projects/scagent-sdk/pixi.lock",
]

[runtimes.cellbender.environment]
MPLBACKEND = "Agg"

[runtimes.diffxpy]
python = "/home/ibrahih3/projects/scagent-sdk/.pixi/envs/diffxpy/bin/python"
prefix = "/home/ibrahih3/projects/scagent-sdk/.pixi/envs/diffxpy"
probe_timeout_seconds = 180
gpu_probe = "torch"
probe_modules = ["numpy", "diffxpy"]
provenance_files = [
  "/home/ibrahih3/projects/scagent-sdk/pixi.toml",
  "/home/ibrahih3/projects/scagent-sdk/pixi.lock",
]

[runtimes.diffxpy.environment]
MPLBACKEND = "Agg"
TF_CPP_MIN_LOG_LEVEL = "3"
CUDA_VISIBLE_DEVICES = ""

[runtimes.biorun]
# The bio_models_inference project's single runtime venv: torch 2.13 (cu130),
# the cell and protein foundation models, and biorun itself. It is deliberately
# not a Pixi environment -- that project is uv-managed and owns its own lock.
# A real file, not a symlink: this registry resolves the configured path with
# Path.resolve(), and every venv's bin/python points at the base interpreter, so
# naming it directly would run a CPython with none of these packages installed.
python = "/data1/peerd/ibrahih3/bio_models_inference/scripts/biorun-python"
prefix = "/data1/peerd/ibrahih3/bio_models_inference/.venv"
probe_timeout_seconds = 300
gpu_probe = "torch"
probe_modules = ["torch", "anndata", "scanpy", "biorun"]
provenance_files = [
  "/data1/peerd/ibrahih3/bio_models_inference/pyproject.toml",
  "/data1/peerd/ibrahih3/bio_models_inference/uv.lock",
]

[runtimes.biorun.environment]
MPLBACKEND = "Agg"
HF_HOME = "/data1/peerd/ibrahih3/hf"
# Weights are resolved from the cache only; biorun raises with the exact
# download command rather than pulling gigabytes inside a session.
BIORUN_ALLOW_DOWNLOAD = "0"
# UCE's figshare assets and TranscriptFormer's tarball are not on Hugging Face and
# default to ./weights, which only resolves from that project's own root.
BIORUN_WEIGHTS_DIR = "/data1/peerd/ibrahih3/bio_models_inference/weights"

[capabilities.biorun]
runtime = "biorun"
timeout_seconds = 7200
# No GPU floor: `check_dataset_for_fm` never touches one, and `embed_cells_with_fm`
# falls back to CPU. biorun picks cuda:0 when it is available and says which device
# it used in provenance, so a busy GPU degrades the run rather than blocking it.
gpu_required = false
required_modules = ["biorun", "torch", "anndata", "scanpy"]

[capabilities.biorun.environment]
BIORUN_PYTHON = "/data1/peerd/ibrahih3/bio_models_inference/scripts/biorun-python"

[capabilities.gpu-singlecell]
runtime = "rapids-main"
timeout_seconds = 7200
gpu_required = true
gpu_count = 1
min_gpu_memory_mb = 4096
required_modules = ["anndata", "scanpy", "rapids_singlecell", "cupy", "sklearn"]

[capabilities.gpu-singlecell.environment]
SCIMILARITY_MODEL_PATH = "/data1/collab002/sail/shared/models/sci/human_v2"
SCIMILARITY_MODEL_PATH_MOUSE = "/data1/collab002/sail/shared/models/sci/mouse_v1"

[capabilities.anndata-io]
runtime = "rapids-main"
timeout_seconds = 7200
gpu_required = false
required_modules = ["anndata"]

[capabilities.scvi]
runtime = "rapids-main"
timeout_seconds = 14400
gpu_required = true
gpu_count = 1
min_gpu_memory_mb = 8192
required_modules = ["anndata", "scanpy", "scvi", "cupy"]

[capabilities.celltypist]
runtime = "rapids-main"
timeout_seconds = 7200
gpu_required = false
required_modules = ["anndata", "scanpy", "celltypist"]

[capabilities.scimilarity]
runtime = "rapids-main"
timeout_seconds = 7200
gpu_required = true
gpu_count = 1
min_gpu_memory_mb = 4096
required_modules = ["anndata", "scanpy", "scimilarity", "cupy"]

[capabilities.scimilarity.environment]
SCIMILARITY_MODEL_PATH = "/data1/collab002/sail/shared/models/sci/human_v2"
SCIMILARITY_MODEL_PATH_MOUSE = "/data1/collab002/sail/shared/models/sci/mouse_v1"

[capabilities.cellbender]
runtime = "cellbender"
timeout_seconds = 21600
gpu_required = true
gpu_count = 1
min_gpu_memory_mb = 8192
required_modules = ["cellbender", "torch", "h5py", "numpy", "scipy", "matplotlib"]

[capabilities.diffxpy]
runtime = "diffxpy"
timeout_seconds = 7200
gpu_required = false
required_modules = ["diffxpy", "numpy"]
