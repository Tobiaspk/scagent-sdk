[workspace]
name = "scagent-sdk-compute"
channels = ["conda-forge", "rapidsai", "nvidia"]
platforms = [
    "linux-64",
    { name = "linux-64-cuda-13-1", platform = "linux-64", cuda = "13.1", glibc = "2.28" },
]

# This workspace owns scientific compute runtimes only. The Claude SDK, terminal,
# state store, media, and web stack remain in the uv-managed agent .venv.

[feature.rapids]
# RAPIDS publishes overlapping package names across rapidsai, nvidia, and
# conda-forge. The validated legacy environment was solved with flexible Conda
# priority; Pixi has no flexible mode, so the lock is resolved across channels
# and then freezes exact package URLs and hashes.
channel-priority = "disabled"
platforms = ["linux-64-cuda-13-1"]

[feature.rapids.dependencies]
python = "3.14.*"
pip = "*"
setuptools = "81.*"
rapids = { version = "26.04.*", channel = "rapidsai" }
cuda-version = { version = "13.1.*", channel = "nvidia" }
cudnn = { version = "9.23.*", channel = "nvidia" }
cupy = "14.0.*"
numpy = "2.4.*"
pandas = "2.3.*"
scipy = "1.16.*"
scikit-learn = "1.9.*"

[feature.rapids.pypi-dependencies]
anndata = "==0.12.17"
scanpy = "==1.12.1"
rapids-singlecell = "==0.15.2"
torch = "==2.12.1"
scvi-tools = "==1.4.3"
celltypist = "==1.7.1"
scimilarity = "==0.4.1"
cytopus = "==1.3.4"
zarr = "==2.18.7"
h5py = "==3.16.0"
igraph = "==1.0.0"
leidenalg = "==0.12.0"
pynndescent = "==0.6.0"
umap-learn = "==0.5.12"

[feature.rapids.activation.env]
SCAGENT_GPU = "1"
MPLBACKEND = "Agg"
CUDA_HOME = "$CONDA_PREFIX"
LD_PRELOAD = "$CONDA_PREFIX/lib/libstdc++.so.6:$CONDA_PREFIX/lib/libnvJitLink.so.13"

[feature.cellbender]
platforms = ["linux-64"]

[feature.cellbender.dependencies]
python = "3.10.*"
pip = "*"

[feature.cellbender.pypi-dependencies]
cellbender = "==0.3.2"

[feature.cellbender.activation.env]
MPLBACKEND = "Agg"

[feature.diffxpy]
platforms = ["linux-64"]

[feature.diffxpy.dependencies]
python = "3.9.*"
pip = "*"

[feature.diffxpy.pypi-dependencies]
numpy = "==1.23.5"
scipy = "==1.9.3"
pandas = "==1.5.3"
anndata = "==0.8.0"
tensorflow-cpu = "==2.10.1"
diffxpy = "==0.7.4"
batchglm = "==0.7.4"
dask = "==2.30.0"
toolz = "==0.11.1"
patsy = "==0.5.6"

[feature.diffxpy.activation.env]
MPLBACKEND = "Agg"
TF_CPP_MIN_LOG_LEVEL = "3"
CUDA_VISIBLE_DEVICES = ""

[environments]
rapids = { features = ["rapids"], no-default-feature = true }
cellbender = { features = ["cellbender"], no-default-feature = true }
diffxpy = { features = ["diffxpy"], no-default-feature = true }
